<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foros | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('PM')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><div class="page-actions"><a class="btn btn-primary" th:href="@{/foros/nuevo(vista='PM')}">＋ Crear espacio</a></div><section class="card"><div class="filters"><input class="search" placeholder="Buscar espacio de discusión"><select class="compact"><option>Todos los proyectos</option></select><select class="compact"><option>Todos los estados</option></select><button class="btn btn-light">Filtros</button></div><div class="forum-item" th:each="f : ${foros}"><div><a th:href="@{/foros/{id}(id=${f.idForo},vista='PM')}"><h3 th:text="${f.titulo}"></h3></a><p><span th:text="${f.proyecto != null ? f.proyecto.nombre : 'General'}"></span> · <span th:text="${f.categoria ?: 'Sin categoría'}"></span> · por <span th:text="${f.autor.nombreCompleto}"></span></p></div><span class="badge" th:classappend="${f.estado.name() == 'RESUELTO'} ? ' badge-success' : ' badge-purple'" th:text="${f.estado}"></span></div></section></div></main></div></body></html>
