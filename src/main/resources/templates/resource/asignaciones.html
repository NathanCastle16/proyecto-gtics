<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asignaciones | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('RM')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><div class="grid-4"><div class="metric"><div class="metric-icon">☷</div><div class="label">Asignaciones</div><div class="value" th:text="${#lists.size(asignaciones)}"></div><div class="hint">Total registrado</div></div><div class="metric green"><div class="metric-icon">✓</div><div class="label">Activas</div><div class="value" th:text="${activas}"></div><div class="hint">En curso</div></div><div class="metric blue"><div class="metric-icon">◷</div><div class="label">Planificadas</div><div class="value" th:text="${planificadas}"></div><div class="hint">Próximas</div></div><div class="metric orange"><div class="metric-icon">◆</div><div class="label">Finalizadas</div><div class="value" th:text="${finalizadas}"></div><div class="hint">Históricas</div></div></div><section class="card section"><div class="filters"><input class="search" placeholder="Buscar asignación"><select class="compact"><option>Todos los proyectos</option></select><select class="compact"><option>Todos los estados</option></select><button class="btn btn-light">Filtros</button></div><div class="table-wrap"><table><thead><tr><th>Colaborador</th><th>Proyecto</th><th>Rol</th><th>Fecha inicio</th><th>Fecha fin</th><th>Carga</th><th>Estado</th></tr></thead><tbody><tr th:each="a : ${asignaciones}"><td><strong th:text="${a.colaborador.usuario.nombreCompleto}"></strong><br><small class="muted" th:text="${a.colaborador.cargo}"></small></td><td th:text="${a.proyecto.nombre}"></td><td th:text="${a.rolProyecto}"></td><td th:text="${a.fechaInicio}"></td><td th:text="${a.fechaFin ?: '-'}"></td><td><div class="progress"><span th:style="|width:${a.porcentajeDedicacion}%|"></span></div><small th:text="|${a.porcentajeDedicacion}%|"></small></td><td><span class="badge" th:classappend="${a.estado.name() == 'ACTIVA'} ? ' badge-success' : ' badge-warning'" th:text="${a.estado}"></span></td></tr></tbody></table></div></section></div></main></div></body></html>
