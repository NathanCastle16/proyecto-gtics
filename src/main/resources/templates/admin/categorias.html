<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categorías | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('ADMIN')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content">
<div class="grid-3"><div class="metric"><div class="metric-icon">▱</div><div class="label">Categorías</div><div class="value" th:text="${totalCategorias}"></div><div class="hint">Derivadas del catálogo</div></div><div class="metric green"><div class="metric-icon">✦</div><div class="label">Habilidades</div><div class="value" th:text="${totalHabilidades}"></div><div class="hint">Registradas en total</div></div><div class="metric blue"><div class="metric-icon">◫</div><div class="label">Uso del catálogo</div><div class="value">100%</div><div class="hint">Modelo simplificado</div></div></div>
<section class="card section"><div class="card-title"><div><h2>Categorías de habilidades</h2><p class="muted">En la base final la categoría se almacena directamente en la tabla habilidades.</p></div><a class="btn btn-primary" th:href="@{/admin/habilidades/nueva}">＋ Nueva habilidad</a></div><div class="grid-3"><article class="soft-panel" th:each="entry : ${categorias}"><div class="metric-icon">▱</div><h3 th:text="${entry.key}"></h3><p class="muted"><strong th:text="${entry.value}"></strong> habilidades asociadas</p><div class="progress"><span th:style="|width:${entry.value * 12 > 100 ? 100 : entry.value * 12}%|"></span></div></article></div></section>
</div></main></div></body></html>
