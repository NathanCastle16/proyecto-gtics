<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitoreo | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('ADMIN')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content">
<div class="grid-4"><div class="metric green"><div class="metric-icon">●</div><div class="label">Estado del sistema</div><div class="value" style="font-size:20px">Operativo</div><div class="hint">Aplicación disponible</div></div><div class="metric"><div class="metric-icon">♙</div><div class="label">Usuarios</div><div class="value" th:text="${usuarios}"></div><div class="hint">Registrados</div></div><div class="metric blue"><div class="metric-icon">⌁</div><div class="label">Eventos auditados</div><div class="value" th:text="${eventos}"></div><div class="hint">Últimos registros</div></div><div class="metric orange"><div class="metric-icon">✦</div><div class="label">Habilidades</div><div class="value" th:text="${habilidades}"></div><div class="hint">Catálogo disponible</div></div></div>
<div class="grid-2 section"><section class="card"><div class="card-title"><h2>Actividad del sistema</h2><span class="badge badge-success">En línea</span></div><div class="sparkline"><span style="height:28%"></span><span style="height:42%"></span><span style="height:36%"></span><span style="height:58%"></span><span style="height:74%"></span><span style="height:63%"></span><span style="height:82%"></span><span style="height:69%"></span><span style="height:76%"></span><span style="height:60%"></span><span style="height:68%"></span></div><div class="grid-3" style="margin-top:18px"><div><small class="muted">Aplicación</small><strong style="display:block;margin-top:4px">Operativa</strong></div><div><small class="muted">Base de datos</small><strong style="display:block;margin-top:4px">Conectada</strong></div><div><small class="muted">Colaboradores</small><strong style="display:block;margin-top:4px" th:text="${colaboradores}"></strong></div></div></section><section class="card"><div class="card-title"><h2>Eventos recientes</h2></div><div class="forum-item" th:each="a : ${actividad}"><div><h3 th:text="${a.accion}"></h3><p th:text="|${a.modulo} · ${a.detalle}|"></p></div><span class="badge badge-blue">evento</span></div></section></div>
</div></main></div></body></html>
