<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Usuarios | SkillBridge AI</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
    <div class="app-shell">
        <aside th:replace="~{fragments/layout :: sidebar('ADMIN')}"></aside>
        <main class="main">
            <header th:replace="~{fragments/layout :: topbar(${titulo})}"></header>
            <div class="content">
                <div class="grid-4">
                    <div class="metric">
                        <div class="metric-icon">♙</div>
                        <div class="label">Usuarios</div>
                        <div class="value" th:text="${#lists.size(usuarios)}"></div>
                        <div class="hint">Resultados actuales</div>
                    </div>
                    <div class="metric green">
                        <div class="metric-icon">✓</div>
                        <div class="label">Activos</div>
                        <div class="value" th:text="${activos}"></div>
                        <div class="hint">Acceso habilitado</div>
                    </div>
                    <div class="metric orange">
                        <div class="metric-icon">Ⅱ</div>
                        <div class="label">Inactivos</div>
                        <div class="value" th:text="${inactivos}"></div>
                        <div class="hint">Sin actividad</div>
                    </div>
                    <div class="metric">
                        <div class="metric-icon">!</div>
                        <div class="label">Bloqueados</div>
                        <div class="value" th:text="${bloqueados}"></div>
                        <div class="hint" style="color:var(--red)">Requieren revisión</div>
                    </div>
                </div>
                <div class="page-actions section"><a class="btn btn-primary" th:href="@{/admin/usuarios/nuevo}">＋ Nuevo
                        usuario</a></div>
                <section class="card">
                    <form class="filters" method="get">
                        <input class="search" type="text" name="q" th:value="${q}" placeholder="Buscar por nombre, correo o rol">

                        <select class="compact" name="rol">
                            <option value="" th:selected="${rol == null or rol == ''}">Todos los roles</option>
                            <option th:each="r : ${roles}" th:value="${r.idRol}" th:text="${r.nombre}" th:selected="${r.idRol == rol}"></option>
                        </select>
                        <label class="badge badge-success" style="cursor: pointer; display: inline-flex; align-items: center; gap: 6px; user-select: none; font-size: 11px; padding: 7px 10px;">
                            <input type="checkbox" name="soloActivos" value="true" th:checked="${soloActivos}">
                            <span>ACTIVO</span>
                        </label>

                        <button type="submit" class="btn btn-light">Buscar</button>
                        <a class="btn btn-light" th:href="@{/admin/usuarios}">Limpiar</a>
                    </form>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Usuario</th>
                                    <th>Rol</th>
                                    <th>Correo</th>
                                    <th>Estado</th>
                                    <th>Último acceso</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="u : ${usuarios}">
                                    <td>
                                        <div class="table-user"><span class="mini-avatar"
                                                th:text="${#strings.substring(u.nombres,0,1)}"></span>
                                            <div><strong th:text="${u.nombreCompleto}"></strong><small
                                                    th:text="${u.telefono ?: 'Sin teléfono'}"></small></div>
                                        </div>
                                    </td>
                                    <td><span class="badge badge-purple" th:text="${u.rol.nombre}"></span></td>
                                    <td th:text="${u.correo}"></td>
                                    <td><span class="badge"
                                            th:classappend="${u.estado.name() == 'ACTIVO'} ? ' badge-success' : (${u.estado.name() == 'BLOQUEADO'} ? ' badge-danger' : ' badge-warning')"
                                            th:text="${u.estado}"></span></td>
                                    <td th:text="${u.ultimoAcceso != null ? u.ultimoAcceso : 'Sin acceso'}"></td>
                                    <td class="text-right"><a class="btn btn-light btn-sm"
                                            th:href="@{/admin/usuarios/editar/{id}(id=${u.idUsuario})}">Editar</a></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="empty" th:if="${#lists.isEmpty(usuarios)}">No se encontraron usuarios.</div>
                </section>
            </div>
        </main>
    </div>
</body>

</html>
