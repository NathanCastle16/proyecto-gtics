<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habilidad | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('ADMIN')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><section class="page-intro"><div><h2>Información de la habilidad</h2><p>Registra una habilidad disponible para los perfiles de colaboradores y requerimientos de proyectos.</p></div></section><section class="card form-card"><form th:action="@{/admin/habilidades/guardar}" th:object="${habilidad}" method="post"><input type="hidden" th:field="*{idHabilidad}"><div class="form-grid"><div class="form-group"><label>Nombre</label><input th:field="*{nombre}" required placeholder="Ej. Spring Boot"></div><div class="form-group"><label>Categoría</label><input th:field="*{categoria}" placeholder="Backend, Frontend, DevOps..."></div><div class="form-group full"><label>Descripción</label><textarea rows="5" th:field="*{descripcion}" placeholder="Describe el alcance o uso principal de la habilidad."></textarea></div><div class="form-group"><label>Estado</label><select th:field="*{estado}"><option th:value="true">Activa</option><option th:value="false">Inactiva</option></select></div></div><div class="form-actions"><a class="btn btn-light" th:href="@{/admin/habilidades}">Cancelar</a><button class="btn btn-primary">Guardar habilidad</button></div></form></section></div></main></div></body></html>
