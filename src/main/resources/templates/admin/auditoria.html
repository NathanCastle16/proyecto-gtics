<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auditoría | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('ADMIN')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><section class="page-intro"><div><h2>Trazabilidad de acciones</h2><p>Consulta los eventos registrados por usuario, módulo y fecha dentro de SkillBridge AI.</p></div><span class="badge badge-success">Registro activo</span></section><section class="card"><div class="filters"><input class="search" placeholder="Buscar usuario, acción o módulo"><select class="compact"><option>Todos los módulos</option><option>Administración</option><option>Proyectos</option><option>Asignaciones</option></select><button class="btn btn-light">Filtros</button></div><div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Módulo</th><th>Detalle</th></tr></thead><tbody><tr th:each="a : ${auditorias}"><td th:text="${a.fecha != null ? a.fecha : '-'}"></td><td><strong th:text="${a.usuario != null ? a.usuario.nombreCompleto : 'Sistema'}"></strong></td><td th:text="${a.accion}"></td><td><span class="badge badge-purple" th:text="${a.modulo}"></span></td><td th:text="${a.detalle}"></td></tr></tbody></table></div><div th:if="${#lists.isEmpty(auditorias)}" class="empty">No hay registros de auditoría todavía.</div></section></div></main></div></body></html>
