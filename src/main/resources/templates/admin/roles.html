<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roles y permisos | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('ADMIN')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content">
<div class="grid-3"><div class="metric"><div class="metric-icon">◆</div><div class="label">Roles totales</div><div class="value" th:text="${#lists.size(roles)}"></div><div class="hint">Perfiles definidos</div></div><div class="metric green"><div class="metric-icon">✓</div><div class="label">Permisos</div><div class="value" th:text="${totalPermisos}"></div><div class="hint">Acciones habilitadas</div></div><div class="metric blue"><div class="metric-icon">♙</div><div class="label">Usuarios</div><div class="value" th:text="${totalUsuarios}"></div><div class="hint">Con rol asignado</div></div></div>
<section class="card section"><div class="card-title"><h2>Roles del sistema</h2><span class="badge badge-purple">Configuración actual</span></div><div class="grid-2"><article class="soft-panel" th:each="r : ${roles}"><div class="card-title"><div><strong th:text="${r.nombre}"></strong><p class="muted" th:text="${r.descripcion}"></p></div><span class="badge" th:classappend="${r.estado} ? ' badge-success' : ' badge-warning'" th:text="${r.estado ? 'ACTIVO' : 'INACTIVO'}"></span></div><div class="tags"><span class="tag" th:each="p : ${permisos}" th:if="${p.rol.idRol == r.idRol}" th:text="${p.modulo}"></span></div></article></div></section>
<section class="card section"><div class="card-title"><h2>Matriz de permisos</h2></div><div class="table-wrap"><table><thead><tr><th>Rol</th><th>Permiso</th><th>Módulo</th><th>Descripción</th></tr></thead><tbody><tr th:each="p : ${permisos}"><td><span class="badge badge-purple" th:text="${p.rol.nombre}"></span></td><td><strong th:text="${p.nombre}"></strong></td><td th:text="${p.modulo}"></td><td th:text="${p.descripcion ?: '-'}"></td></tr></tbody></table></div></section>
</div></main></div></body></html>
