<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Habilidades | SkillBridge AI</title>
        <link rel="stylesheet" th:href="@{/css/app.css}">
    </head>
    
    <body>
        <div class="app-shell">
            <aside th:replace="~{fragments/layout :: sidebar('ADMIN')}"></aside>
            <main class="main">
                <header th:replace="~{fragments/layout :: topbar(${titulo})}"></header>
                <div class="content">

                    <div class="grid-3">
                        <div class="metric">
                            <div class="metric-icon">✦</div>
                            <div class="label">Habilidades</div>
                            <div class="value" th:text="${#lists.size(habilidades)}"></div>
                            <div class="hint">Resultados actuales</div></div>
                            <div class="metric green"><div class="metric-icon">✓</div>
                            <div class="label">Activas</div>
                            <div class="value" th:text="${numberActivas}"></div>
                            <div class="hint">Disponibles en catálogo</div>
                        </div>
                        <div class="metric blue">
                            <div class="metric-icon">▱</div>
                            <div class="label">Categorías</div>
                            <div class="value" th:text="${numberCategorias}"></div>
                            <div class="hint">Clasificación técnica</div>
                        </div>
                    </div>

                    <div class="page-actions section">
                        <a class="btn btn-primary" th:href="@{/admin/habilidades/nueva}">＋ Nueva habilidad</a>
                    </div>
                    
                    <section class="card">
                        <form class="filters" method="get" th:action="@{/admin/habilidades}">
                            <input class="search" type="text" name="q" th:value="${q}" placeholder="Buscar por nombre o descripción...">
                            <select class="compact" name="categoria">
                                <option value="" th:selected="${categoria == null or '' == categoria}">Todas las categorías</option>
                                <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat}" th:selected="${cat == categoria}"></option>
                            </select>
                            <label class="badge badge-success" style="cursor: pointer; display: inline-flex; align-items: center; gap: 6px; user-select: none; font-size: 11px; padding: 7px 10px;">
                                <input type="checkbox" name="soloActivas" value="true" th:checked="${soloActivas}">
                                <span>ACTIVA</span>
                            </label>
                            <button type="submit" class="btn btn-light">
                                Buscar
                            </button>
                            <a th:href="@{/admin/habilidades}" class="btn btn-light" title="Restablecer filtros">
                                Limpiar
                            </a>
                        </form>

                        <div class="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Habilidad</th>
                                        <th>Categoría</th>
                                        <th>Descripción</th>
                                        <th>Estado</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="h : ${habilidades}">
                                        <td>
                                            <div class="table-user">
                                                <span class="mini-avatar">✦</span>
                                                <div>
                                                    <strong th:text="${h.nombre}"></strong>
                                                    <small>SkillBridge catalog</small>
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <span class="badge badge-purple" th:text="${h.categoria}"></span>
                                        </td>
                                        <td th:text="${h.descripcion}"></td>
                                        <td>
                                            <span class="badge" th:classappend="${h.estado} ? ' badge-success' : ' badge-warning'" th:text="${h.estado ? 'ACTIVA' : 'INACTIVA'}"></span>
                                        </td>
                                        <td class="text-right">
                                            <a class="btn btn-light btn-sm" th:href="@{/admin/habilidades/editar/{id}(id=${h.idHabilidad})}">Editar</a>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </body>
</html>
