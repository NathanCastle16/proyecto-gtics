<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuario | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('ADMIN')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><section class="page-intro"><div><h2>Información del usuario</h2><p>Completa los datos de identificación, contacto, rol y estado de acceso.</p></div></section><section class="card form-card"><form th:action="@{/admin/usuarios/guardar}" th:object="${usuario}" method="post"><input type="hidden" th:field="*{idUsuario}"><div class="form-grid"><div class="form-group"><label>Nombres</label><input type="text" th:field="*{nombres}" maxlength="20" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]{1,20}" required placeholder="Ej. María"></div><div class="form-group"><label>Apellidos</label><input type="text" th:field="*{apellidos}" maxlength="20" pattern="[A-Za-zÁÉÍÓÚáéíóúÑñÜü ]{1,20}" required placeholder="Ej. González"></div><div class="form-group"><label>Correo institucional</label><input type="email" th:field="*{correo}" required placeholder="nombre@empresa.com"></div><div class="form-group"><label>Teléfono</label><input type="text" th:field="*{telefono}" maxlength="9" inputmode="numeric" pattern="[0-9]{9}" oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,9)" placeholder="999111001"></div><div class="form-group"><label>Rol</label><select name="idRol" required><option th:each="r : ${roles}" th:value="${r.idRol}" th:text="${r.nombre}" th:selected="${usuario.rol != null and usuario.rol.idRol == r.idRol}"></option></select><p class="help">Los roles operativos pueden contar con un perfil profesional asociado.</p></div><div class="form-group"><label>Estado</label><select th:field="*{estado}"><option value="ACTIVO">ACTIVO</option><option value="INACTIVO">INACTIVO</option><option value="BLOQUEADO">BLOQUEADO</option></select></div><div class="form-group full"><label>Clave de acceso / valor almacenado</label><input type="text" th:field="*{passwordHash}" required placeholder="Valor requerido por la tabla usuarios"></div></div><div class="form-actions"><a class="btn btn-light" th:href="@{/admin/usuarios}">Cancelar</a><button class="btn btn-primary" type="submit">Guardar usuario</button></div></form></section></div></main></div></body></html>
