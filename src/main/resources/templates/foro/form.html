<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nuevo foro | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar(${rolVista})}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><section class="page-intro"><div><h2>Crear espacio de discusión</h2><p>Registra una pregunta, problema o tema asociado a un proyecto para conservar el conocimiento del equipo.</p></div></section><section class="card form-card"><form th:action="@{/foros/guardar}" th:object="${foro}" method="post"><input type="hidden" name="vista" th:value="${rolVista}"><div class="form-grid"><div class="form-group full"><label>Título</label><input th:field="*{titulo}" required placeholder="Ej. Error de conexión con API"></div><div class="form-group"><label>Proyecto</label><select name="idProyecto"><option value="">General</option><option th:each="p : ${proyectos}" th:value="${p.idProyecto}" th:text="${p.nombre}"></option></select></div><div class="form-group"><label>Categoría</label><input th:field="*{categoria}" placeholder="Backend, API, Base de datos..."></div><div class="form-group full"><label>Contenido</label><textarea rows="8" th:field="*{contenido}" required placeholder="Describe el contexto, problema o consulta..."></textarea></div><div class="form-group"><label>Estado</label><select th:field="*{estado}"><option value="ABIERTO">ABIERTO</option><option value="RESUELTO">RESUELTO</option><option value="CERRADO">CERRADO</option></select></div></div><div class="form-actions"><a class="btn btn-light" th:if="${rolVista == 'PM'}" th:href="@{/pm/foros}">Cancelar</a><a class="btn btn-light" th:unless="${rolVista == 'PM'}" th:href="@{/colaborador/foros}">Cancelar</a><button class="btn btn-primary">Publicar tema</button></div></form></section></div></main></div></body></html>
