<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foro | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar(${rolVista})}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><section class="card hero-card"><div class="card-title"><div><span class="badge badge-purple" th:text="${foro.categoria ?: 'General'}"></span><h2 th:text="${foro.titulo}"></h2><p class="muted"><span th:text="${foro.autor.nombreCompleto}"></span> · <span th:text="${foro.proyecto != null ? foro.proyecto.nombre : 'General'}"></span></p></div><span class="badge" th:classappend="${foro.estado.name() == 'RESUELTO'} ? ' badge-success' : ' badge-purple'" th:text="${foro.estado}"></span></div><p style="line-height:1.75" th:text="${foro.contenido}"></p></section><section class="card section"><div class="card-title"><h2>Respuestas</h2><span class="badge badge-purple" th:text="${#lists.size(respuestas)}"></span></div><div class="reply" th:classappend="${r.esSolucion} ? ' solution'" th:each="r : ${respuestas}"><div class="card-title"><div><strong th:text="${r.autor.nombreCompleto}"></strong><small class="muted" th:text="${r.fechaCreacion != null ? ' · ' + r.fechaCreacion : ''}"></small></div><span class="badge badge-success" th:if="${r.esSolucion}">SOLUCIÓN</span></div><p th:text="${r.contenido}"></p><form th:if="${!r.esSolucion}" th:action="@{/foros/{idForo}/solucion/{idRespuesta}(idForo=${foro.idForo},idRespuesta=${r.idRespuesta})}" method="post"><input type="hidden" name="vista" th:value="${rolVista}"><button class="btn btn-light btn-sm">Marcar como solución</button></form></div><div class="empty" th:if="${#lists.isEmpty(respuestas)}">Sé el primero en responder.</div></section><section class="card section"><h2 class="mt-0">Responder</h2><form th:action="@{/foros/{id}/responder(id=${foro.idForo})}" method="post"><input type="hidden" name="vista" th:value="${rolVista}"><textarea rows="5" name="contenido" required placeholder="Escribe una respuesta..."></textarea><div class="form-actions"><button class="btn btn-primary">Publicar respuesta</button></div></form></section></div></main></div></body></html>
