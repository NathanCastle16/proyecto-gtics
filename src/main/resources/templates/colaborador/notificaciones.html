<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notificaciones | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('COL')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><div class="grid-3"><div class="metric"><div class="metric-icon">♢</div><div class="label">Notificaciones</div><div class="value" th:text="${#lists.size(notificaciones)}"></div><div class="hint">Historial reciente</div></div><div class="metric orange"><div class="metric-icon">!</div><div class="label">No leídas</div><div class="value" th:text="${noLeidas}"></div><div class="hint">Pendientes de revisar</div></div><div class="metric green"><div class="metric-icon">✓</div><div class="label">Canal</div><div class="value" style="font-size:18px">Plataforma</div><div class="hint">Notificaciones internas</div></div></div><section class="card section"><div class="card-title"><h2>Centro de notificaciones</h2><span class="badge badge-purple">Actividad reciente</span></div><article class="notice" th:classappend="${!n.leida} ? ' unread' : ''" th:each="n : ${notificaciones}"><div class="notice-icon">♢</div><div style="flex:1"><div class="card-title" style="margin:0"><strong th:text="${n.titulo}"></strong><span class="badge badge-purple" th:text="${n.tipo}"></span></div><p class="muted" style="margin:4px 0" th:text="${n.mensaje}"></p><small class="muted" th:text="${n.fechaCreacion != null ? n.fechaCreacion : ''}"></small></div></article><div class="empty" th:if="${#lists.isEmpty(notificaciones)}">No tienes notificaciones.</div></section></div></main></div></body></html>
