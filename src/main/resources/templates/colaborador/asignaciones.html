<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis asignaciones | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('COL')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><section class="card"><div class="filters"><input class="search" placeholder="Buscar asignación"><select class="compact"><option>Todos los estados</option><option>ACTIVA</option><option>PLANIFICADA</option><option>FINALIZADA</option></select><button class="btn btn-light">Filtros</button></div><div class="table-wrap"><table><thead><tr><th>Proyecto</th><th>Rol / posición</th><th>Prioridad</th><th>Estado</th><th>Fecha inicio</th><th>Carga</th><th>Progreso proyecto</th></tr></thead><tbody><tr th:each="a : ${asignaciones}"><td><strong th:text="${a.proyecto.nombre}"></strong><br><small class="muted" th:text="${a.proyecto.descripcion}"></small></td><td th:text="${a.rolProyecto}"></td><td><span class="badge badge-purple" th:text="${a.proyecto.prioridad}"></span></td><td><span class="badge" th:classappend="${a.estado.name() == 'ACTIVA'} ? ' badge-success' : ' badge-warning'" th:text="${a.estado}"></span></td><td th:text="${a.fechaInicio}"></td><td><div class="progress"><span th:style="|width:${a.porcentajeDedicacion}%|"></span></div><small th:text="|${a.porcentajeDedicacion}%|"></small></td><td><div class="progress green"><span th:style="|width:${a.proyecto.progreso}%|"></span></div><small th:text="|${a.proyecto.progreso}%|"></small></td></tr></tbody></table></div><div class="empty" th:if="${#lists.isEmpty(asignaciones)}">No tienes asignaciones registradas.</div></section></div></main></div></body></html>
