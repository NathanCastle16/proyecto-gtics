<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat | SkillBridge AI</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div class="app-shell"><aside th:replace="~{fragments/layout :: sidebar('COL')}"></aside><main class="main"><header th:replace="~{fragments/layout :: topbar(${titulo})}"></header><div class="content"><section class="card chat-shell"><aside class="chat-list"><h3>Mis proyectos</h3><a class="chat-project" th:each="a : ${asignaciones}" th:href="@{/colaborador/chat(idProyecto=${a.proyecto.idProyecto})}"><strong th:text="${a.proyecto.nombre}"></strong><small class="muted" style="display:block;margin-top:4px" th:text="${a.rolProyecto}"></small></a><div class="empty" th:if="${#lists.isEmpty(asignaciones)}">Sin proyectos.</div></aside><div class="chat-main" th:if="${proyectoSeleccionado != null}"><header class="chat-head"><strong th:text="${proyectoSeleccionado.nombre}"></strong><small class="muted" style="display:block" th:text="|${proyectoSeleccionado.estado} · Equipo del proyecto|"></small></header><div class="chat-messages"><div class="message" th:classappend="${m.usuario.idUsuario == colaborador.usuario.idUsuario} ? ' mine' : ''" th:each="m : ${mensajes}"><strong th:text="${m.usuario.nombreCompleto}"></strong><div th:text="${m.contenido}"></div><small th:text="${m.fechaEnvio != null ? m.fechaEnvio : ''}"></small></div><div class="empty" th:if="${#lists.isEmpty(mensajes)}">Aún no hay mensajes en este proyecto.</div></div><form class="chat-form" th:action="@{/colaborador/chat/enviar}" method="post"><input type="hidden" name="idProyecto" th:value="${proyectoSeleccionado.idProyecto}"><input name="contenido" placeholder="Escribe un mensaje..." required><button class="btn btn-primary">Enviar</button></form></div><div class="empty" th:if="${proyectoSeleccionado == null}">No tienes proyectos disponibles para chat.</div></section></div></main></div></body></html>
